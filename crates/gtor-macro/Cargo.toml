[package]
name = "gtor-macro"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "visit", "visit-mut"] }

[dev-dependencies]
# This must be a relative path and not `workspace = true`, because otherwise we can't publish this (chicken/egg).
gtor = { path = "../gtor" }
