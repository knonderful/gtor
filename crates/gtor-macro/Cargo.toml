[package]
name = "gtor-macro"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "visit", "visit-mut"] }

[dev-dependencies]
gtor = { workspace = true }
